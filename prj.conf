
# Zephyr OS & Hardware
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# LoRa & SPI
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_LORA=y
CONFIG_LORA_SX126X=y

# Audio & I2S
CONFIG_I2S=y
CONFIG_AUDIO=y

# Threading & IPC
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_TIMESLICING=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LORA_LOG_LEVEL_WRN=y
CONFIG_I2S_LOG_LEVEL_ERR=y

# Enable Newlib C Library for Codec2 math/memory dependencies
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Memory Management (No Malloc allowed in audio threads)
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Native Opus Integration
CONFIG_OPUS=y
CONFIG_OPUS_CUSTOM_MODES=y

